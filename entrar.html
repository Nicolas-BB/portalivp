<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Perto de Você</title>
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="entrar.css">
</head>
<body>
<main class="auth">
    <section class="auth-card" aria-labelledby="entrar-titulo">
        <header class="auth-head">
            <a class="logo" href="inicial.html" aria-label="Perto de Você - Voltar à página inicial">
                <span class="logo-icon"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg></span>
                <span class="logo-text">Perto de Você</span>
            </a>
            <h1 id="entrar-titulo" class="auth-title">Bem-vindo de Volta!</h1>
            <p class="auth-subtitle">Entre na sua conta para continuar.</p>
        </header>

        <form class="auth-form" id="form-entrar" action="#" novalidate>
        <div class="field">
                <label class="field-label" for="email">E-mail</label>
                <input type="email" id="email" name="email" autocomplete="email" placeholder="voce@email.com" aria-describedby="erro-mail" required>
                <p class="field-error" id="erro-mail" role="alert"></p>
            </div>

            <div class="field">
                <label class="field-label" for="senha">Senha</label>
                <div class="password-wrap">
                <input type="password" id="senha" name="senha" autocomplete="current-password" placeholder="Sua Senha" aria-describedby="erro-senha" required>
                <button class="toggle-senha" type="button" data-alvo="senha" aria-label="Mostrar Senha"></button>
                <p class="field-error" id="erro-senha" role="alert"></p>
                </div>
                <p class="field-error" id="erro-senha" role="alert"></p>
            </div>

            <div class="auth-row">
                <label class="check"><input type="checkbox" name="lembrar">Lembrar de Mim</label>
                <a class="auth-link" href="#">Esqueceu sua senha?</a>
            </div>

            <button class="botao-principal" type="submit">Entrar</button>
            <p class="form-status" id="status" role="status"></p>
        </form>

        <p class="auth-switch">Ainda não tem uma conta? <a class="auth-link" href="cadastrar.html">Cadastre-se</a></p>
        <a class="auth-back" href="inicial.html">← Voltar à página inicial</a>
    </section>
</main>
    
</body>
</html>
