# Dependabot: abre PRs para atualizar as dependências.
# Uma vez por semana, as atualizações menores (minor e patch) vêm juntas num PR só.
# As correções de segurança chegam na hora, fora desse calendário.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)
    labels: [dependencies]
    ignore:
      # TypeScript 7: o Nest CLI ainda usa o 6.0 e o CI falha com o 7 (decisões W4-A e DB1-A).
      # Reavaliar quando o Nest CLI suportar o 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # @types/node descreve o Node em uso (o 24, decisão W1-A), então só sobe junto com ele (DB2-A).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Vitest: ficamos na versão que o gerador do Nest entrega (a 4), decisão DB3-B.
      # Reavaliar quando o modelo do `nest new` passar para o 5.
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)
    labels: [dependencies]
